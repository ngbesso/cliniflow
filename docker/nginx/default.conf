# Nginx reçoit les requêtes HTTP et transmet celles qui concernent PHP
# au service "app" (PHP-FPM) sur le port 9000.
server {
    listen 80;
    server_name localhost;

    # Laravel expose uniquement son dossier public/
    root /var/www/backend/public;
    index index.php;

    charset utf-8;
    client_max_body_size 10M;

    # Toute URL qui n'est pas un fichier existant est confiée à index.php :
    # c'est le routeur de Laravel qui décide.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        # "app" est le nom du service dans compose.yaml : Docker le
        # résout automatiquement sur le réseau interne.
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    # Interdire l'accès aux fichiers cachés (.env, .git…)
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
